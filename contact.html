<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sustainable food webshop</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main>
        <h2>Contact us</h2>
        <p>Bla bla bla placeholder text get in touch</p>
        <form class="contact-form">
            <label for="first-name" class="visually-hidden">First name</label>
            <input type="text" id="first-name" name="first-name" placeholder="First name" required>

            <label for="email" class="visually-hidden">E-mail address</label>
            <input type="email" id="email" name="email" placeholder="E-mail address" required>
            
            <label for="message" class="visually-hidden">Melding:</label>
            <textarea id="message" name="message" placeholder="Message here"></textarea>

            <button type="submit">Send</button>
    </main>
    
</body>
</html>
