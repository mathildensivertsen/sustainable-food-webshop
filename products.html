<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sustainable food webshop</title>
    <link rel="stylesheet" href="./style.css">
</head>
</head>

<body>
    <header class="header">
        <button class="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="main-menu">
            <span aria-hidden="true">☰</span>
        </button>

        <a href="index.html" class="logo">FRAM</a>

        <button class="cart" id="cart-button" aria-label="Shopping basket, 0 items">
            <span id="cart-count" aria-hidden="true">0</span>
        </button>

        <nav id="main-menu" class="main-menu" aria-label="Main menu" hidden>
            <ul>
                <li><a href="products.html">Products</a></li>
                <li><a href="chat.html">Chat</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <a href="#" class="checkout-link" aria-disabled="true">Checkout</a>
        </nav>
    </header>

    <main>
        <section class="produce-catalouge">

        </section>

        <section class="map-section">

        </section>
    </main>

    <footer class="footer">
        <p class="logo">FRAM</p>
        <hr>
        <h2>Stay updated</h2>
        <p>Sign up for our newsletter to be the first to know about new produce or other exciting news!</p>
        <form class="newsletter-form">
            <label for="first-name" class="visually-hidden">First name</label>
            <input type="text" id="first-name" name="first-name" placeholder="First name" required>

            <label for="email" class="visually-hidden">E-mail address</label>
            <input type="email" id="email" name="email" placeholder="E-mail address" required>

            <button type="submit">Send</button>
        </form>
    </footer>
</body>

</html>
